server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Vite fingerprints its JS and CSS, so those are safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The sprite atlas and ground tiles: ~1300 PNGs that only change when the
    # Blender pipeline is re-run, which means a new image anyway. Caching these
    # hard is what turns the second visit into an instant one.
    location ~* \.(png|jpg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html must NOT be cached, or a browser keeps loading the old build's
    # script tags after the container is updated and the game silently stays on
    # the previous version.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
