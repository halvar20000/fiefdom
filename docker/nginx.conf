server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The game's own assets. These share the /assets/ prefix with Vite's
    # bundles but are NOT fingerprinted -- tiles.json, buildings.json and the
    # PNGs beside them keep fixed names and change whenever the Blender
    # pipeline is re-run.
    #
    # Serving them "immutable" was a trap that failed silently rather than
    # loudly: a browser holding last build's tiles.json does not know what
    # water is, so painted water falls back to layer 0 and renders as SAND,
    # and a browser holding last build's buildings.json has no frame for the
    # fisherman's hut, so the building is skipped and draws nothing at all.
    # Both were reported exactly that way.
    #
    # The client now appends ?v=<build id> to these, so they could safely be
    # cached hard; this stays on must-revalidate anyway, because the cost is
    # one conditional request and the failure mode is a game that quietly
    # renders the wrong world.
    location ~ ^/assets/(tiles|sprites)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Vite fingerprints its JS and CSS, so those are safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Anything else image-shaped. The sprite and tile PNGs are matched by the
    # rule above, which comes first and therefore wins.
    location ~* \.(png|jpg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html must NOT be cached, or a browser keeps loading the old build's
    # script tags after the container is updated and the game silently stays on
    # the previous version.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
