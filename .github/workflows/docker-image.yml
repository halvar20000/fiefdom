name: Build & publish image

# Builds the Fiefdom image and pushes it to GitHub Container Registry, so
# self-hosters pull rather than build.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Don't rebuild for changes that cannot affect the running game. Without
    # this, editing the README republishes the image and Unraid shows a
    # phantom "update available" for a container that has not changed.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'templates/**'
      - 'ca_profile.xml'
      - 'icon.png'
      - 'LICENSE'
      - '.gitignore'
      - 'reference/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fiefdom

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 as well as amd64: plenty of home servers are ARM, and an
          # image that only runs on x86 fails at install time with a message
          # nobody can act on.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
