name: Build & publish image

# Builds the Fiefdom image and pushes it to GitHub Container Registry, so
# self-hosters pull rather than build.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Don't rebuild for changes that cannot affect the running game. Without
    # this, editing the README republishes the image and Unraid shows a
    # phantom "update available" for a container that has not changed.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'templates/**'
      - 'ca_profile.xml'
      - 'icon.png'
      - 'LICENSE'
      - '.gitignore'
      - 'reference/**'
  workflow_dispatch:

# One build of a branch at a time, and the newest push wins.
#
# Without this, pushing twice in quick succession leaves two builds racing for
# the same `latest` tag, and whichever finishes LAST wins -- so a slow build of
# an older commit can quietly republish `latest` as the older image after the
# newer one has already landed. That happened on 1.38.0/1.39.0: the 1.38.0
# build sat in buildx for twenty minutes, against a two-to-three minute norm,
# while 1.39.0 started and passed it.
#
# Superseded builds are also just waste: nobody wants the image for a commit
# that is already two commits old.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fiefdom

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 as well as amd64: plenty of home servers are ARM, and an
          # image that only runs on x86 fails at install time with a message
          # nobody can act on.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Publish a plain Docker schema-2 manifest list -- no OCI media types,
          # no provenance/SBOM attestations. This is the whole reason Unraid
          # showed "up to date" against a newer image and forced a manual
          # update: its checker reads schema-2 (the format every Docker Hub
          # multi-arch image uses) but not GHCR's default OCI image index, and
          # the attestations add platform:"unknown" manifests that confuse the
          # digest comparison further. `outputs: type=registry` replaces
          # `push: true` -- the two are mutually exclusive.
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
