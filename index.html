<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fiefdom</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #10100e; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; left: 12px; top: 12px; z-index: 10;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e8dcc0; background: rgba(20,16,10,.72);
        border: 1px solid rgba(200,170,110,.28); border-radius: 4px;
        padding: 8px 10px; pointer-events: none; white-space: pre;
        text-shadow: 0 1px 2px rgba(0,0,0,.8);
      }
      #hud b { color: #f0c869; font-weight: 600; }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
        font: 14px ui-monospace, Menlo, monospace; color: #c8b48a; background: #10100e;
        transition: opacity .3s; 
      }
      #loading.done { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="loading">building the world…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
